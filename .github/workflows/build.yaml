name: BABE.INFO FINAL 100% JADI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.29.0', channel: stable }

      - name: Install CMake & NDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" "ndk;25.1.8937393"

      - name: Build FINAL
        run: |
          flutter clean
          flutter pub get
          PUB=$HOME/.pub-cache/hosted/pub.dev
          ANGLE=$(find $PUB -maxdepth 1 -type d -name "flutter_angle-*" | head -n1)
          echo "Patch ANGLE $ANGLE"
          find $ANGLE -type f \( -name "*.txt" -o -name "*.gradle" \) -exec sed -i 's/3\.31\.4/3.22.1/g; s/3\.31/3.22.1/g' {} + 2>/dev/null || true
          CORE=$(find $PUB -maxdepth 1 -type d -name "three_js_core-*" | head -n1)
          echo "CORE $CORE"
          flutter build apk --release 2>&1 | tee build.log
          tail -n 100 build.log
          find build/ -name "*.apk" -exec ls -lh {} \;

      - name: Rename APK - FINAL NO TYPO
        run: |
          APK=$(find build/ -name "*.apk" | head -n1)
          echo "FOUND APK=$APK"
          cp "$APK"./BABE-INFO-threejs-antiblink.apk
          ls -lh./*.apk build/app/outputs/flutter-apk/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: BABE.INFO v${{ github.run_number }} FINAL
          files: BABE-INFO-threejs-antiblink.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}