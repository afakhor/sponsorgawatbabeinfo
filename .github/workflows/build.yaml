name: Build BABE.INFO Blackhole APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-blackhole-apk:
    name: Build Sponsorbabeinfogawat APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17 (untuk Flutter 3.22+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.22+ (support shaders)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.5'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Clean & Get Dependencies
        run: |
          flutter clean
          flutter pub get
          # Pastikan flutter_angle & three_js ke-download
          flutter precache --android

      - name: Check shaders & assets
        run: |
          ls -R shaders/ || echo "shaders folder missing - create it!"
          ls -R assets/images/ || echo "assets/images missing"
          cat pubspec.yaml | grep -A 10 "shaders:"

      - name: Build APK Release - Blackhole Gawat
        run: |
          flutter build apk --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=./symbols/ \
            --dart-define=BLACKHOLE_MODE=true

      - name: Build APK Universal (fallback)
        if: failure()
        run: |
          flutter build apk --release --no-split-per-abi

      - name: Rename APK BABE.INFO
        run: |
          mkdir -p build/output/
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/output/BABE-INFO-BLACKHOLE-v${{ github.run_number }}-arm64.apk || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/output/BABE-INFO-BLACKHOLE-v${{ github.run_number }}-armv7.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk build/output/BABE-INFO-BLACKHOLE-v${{ github.run_number }}-x64.apk || true
          cp build/app/outputs/flutter-apk/app-release.apk build/output/BABE-INFO-BLACKHOLE-v${{ github.run_number }}-UNIVERSAL.apk || true
          ls -lh build/output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BABE-INFO-Blackhole-APK-${{ github.run_number }}
          path: |
            build/output/*.apk
            build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create Release (kalau tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/output/*.apk
          body: |
            🕳️🌪️ BABE.INFO BLACKHOLE ATMOSPHERE - Sponsorbabeinfogawat Gawat!
            
            - Globe terjebak pusaran blackhole
            - Shader globe.frag 60FPS
            - Running text 20px bold italic shades
            - Wave music hipnotis ketarik blackhole
            - Video 60 detik sponsor gawat
            
            By Heru Wingchun