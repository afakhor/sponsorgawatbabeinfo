name: Build BABE.INFO Blackhole APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-blackhole-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false # Matikan cache untuk mencegah engine/maven resolution mismatch

      - name: Accept Licenses & Install NDK + SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.0.12077973" \
            "platforms;android-34" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "cmake;3.31.4" || true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Fetch Pub Dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Apply Patch to flutter_screen_recording
        run: |
          echo "Patching flutter_screen_recording in pub-cache..."
          FILES=$(find /home/runner/.pub-cache -name "RecordService.java" 2>/dev/null)
          for FILE in $FILES; do
            if [ -f "$FILE" ]; then
              echo "Patching file: $FILE"
              sed -i 's/setVideoEncodingBitRate.*/setVideoEncodingBitRate(12000000);/' "$FILE" || true
              sed -i 's/VIDEO_BITRATE.*/VIDEO_BITRATE = 12000000;/' "$FILE" || true
              sed -i 's/setVideoFrameRate.*/setVideoFrameRate(30);/' "$FILE" || true
            fi
          done

      - name: Build APK - Blackhole Gawat HD Bersuara
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BABE-INFO-Blackhole-HD-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30