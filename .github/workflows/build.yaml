name: BABE.INFO sponsorbabeinfogawat anti blink

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter 3.29.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true

      - name: Flutter Clean & Pub Get
        run: |
          flutter clean
          rm -f pubspec.lock
          flutter pub get

      - name: Verify Package Name
        run: |
          echo "=== CEK 6 TEMPAT HARUS com.example.sponsorbabeinfogawat ==="
          grep -r "sponsorbabeinfogawat" android/ --include="*.kts" --include="*.xml" --include="*.kt" --include="*.pro" || echo "BELUM SINKRON!"
          ls -R android/app/src/main/kotlin/com/example/sponsorbabeinfogawat/

      - name: Build APK Release
        run: flutter build apk --release -v

      - name: List APK
        if: success()
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Rename APK
        if: success()
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/BABE-INFO-sponsorbabeinfogawat-v${{ github.run_number }}.apk

      - name: Upload Artifact (buat download langsung)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-sponsorbabeinfogawat
          path: build/app/outputs/flutter-apk/BABE-INFO-sponsorbabeinfogawat-v${{ github.run_number }}.apk

      - name: Release APK to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3d-${{ github.run_number }}
          name: BABE.INFO sponsorbabeinfogawat v${{ github.run_number }} - FIX LOADING
          body: |
            ### FIX TOTAL v${{ github.run_number }}
            Package: com.example.sponsorbabeinfogawat
            - three_js 0.1.7 (hapus flutter_gl manual -> fix loading terus)
            - Globe emas + 3 cincin hitam + waveform + slider 60 detik FULL FITUR
            - Fix video: stop player + temp dir
            - Android: Impeller off + NDK 25.1 + compileSdk 35 anti blink
          files: build/app/outputs/flutter-apk/BABE-INFO-sponsorbabeinfogawat-v${{ github.run_number }}.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-web:
    runs-on: ubuntu-latest
    needs: build-apk
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Web Static
        run: |
          mkdir -p _site/assets/images
          if [ -f web/babe.html ]; then
            cp web/babe.html _site/babe.html
            cp web/babe.html _site/index.html
          fi
          cp -r assets/images/* _site/assets/images/ 2>/dev/null || true
          ls -R _site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages