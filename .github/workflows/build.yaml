name: Build BABE.INFO Blackhole APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-blackhole-apk:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter - FIX
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          # flutter-version dihapus - auto latest!

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Clean & Get
        run: |
          flutter clean
          flutter pub get

      - name: Fix Gradle Version
        run: |
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.0-all.zip" > android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Build APK Release - FIX AGP9
        run: |
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BABE-INFO-Blackhole-APK
          path: build/app/outputs/flutter-apk/*.apk