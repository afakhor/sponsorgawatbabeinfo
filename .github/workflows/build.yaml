name: Build BABE.INFO Blackhole APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-blackhole-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses & Install NDK 28
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358" "platforms;android-36" || true
          ls $ANDROID_HOME/ndk/ || true

      - name: Fix Gradle Wrapper URL
        run: |
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https://services.gradle.org/distributions/gradle-8.13-all.zip
          EOF
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Clean & Get
        run: |
          flutter clean
          flutter pub get

      - name: Build APK - Blackhole Gawat
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BABE-INFO-Blackhole-APK-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30