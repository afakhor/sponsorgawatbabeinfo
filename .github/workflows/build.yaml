name: BABE.INFO Learn three_js anti blink
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable

      - name: Clean old lock
        run: rm -f pubspec.lock

      - name: Flutter pub get
        run: flutter pub get

      - name: Install CMake 3.22.1
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" --sdk_root=$ANDROID_SDK_ROOT

      - name: Fix NDK to 28.2.13676358
        run: |
          echo "Fixing NDK version..."
          # untuk build.gradle.kts
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/ndkVersion = ".*"/ndkVersion = "28.2.13676358"/g' android/app/build.gradle.kts || true
            if ! grep -q "ndkVersion" android/app/build.gradle.kts; then
              sed -i '/android {/a \    ndkVersion = "28.2.13676358"' android/app/build.gradle.kts
            fi
            cat android/app/build.gradle.kts | grep -n ndkVersion
          fi
          # untuk build.gradle
          if [ -f android/app/build.gradle ]; then
            sed -i 's/ndkVersion ".*"/ndkVersion "28.2.13676358"/g' android/app/build.gradle || true
            sed -i 's/ndkVersion = ".*"/ndkVersion = "28.2.13676358"/g' android/app/build.gradle || true
          fi

      - name: PATCH flutter_angle CMake 3.31 -> 3.22.1
        run: |
          PUB_DIR=/home/runner/.pub-cache/hosted/pub.dev
          ANGLE=$(find $PUB_DIR -maxdepth 1 -type d -name "flutter_angle-*" | head -n 1)
          echo "ANGLE DIR: $ANGLE"
          if [ -n "$ANGLE" ] && [ -d "$ANGLE" ]; then
            sed -i 's/3.31.4/3.22.1/g' $ANGLE/android/build.gradle || true
            sed -i 's/3\.31/3.22.1/g' $ANGLE/android/build.gradle || true
            if [ -f "$ANGLE/android/src/main/cpp/CMakeLists.txt" ]; then
              sed -i 's/3.31.4/3.22.1/g' $ANGLE/android/src/main/cpp/CMakeLists.txt || true
              sed -i 's/3\.31/3.22.1/g' $ANGLE/android/src/main/cpp/CMakeLists.txt || true
            fi
          else
            echo "flutter_angle not found, skip patch"
          fi

      - name: Build APK Release
        run: flutter build apk --release -v

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/BABE-INFO-threejs-antiblink.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3d-${{ github.run_number }}
          name: BABE.INFO 3D Globe AntiBlink ${{ github.run_number }}
          body: |
            APK anti blink three_js 0.2.7
            - texture babe_gold.jpg
            - Firebase + Hive init
            - audio_waveforms OFF (biang blink)
          files: build/app/outputs/flutter-apk/BABE-INFO-threejs-antiblink.apk
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy-web:
    runs-on: ubuntu-latest
    needs: build-apk
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build web simple
        run: |
          mkdir -p _site/assets/images
          cp web/babe.html _site/ || echo "no babe.html"
          cp assets/images/babe_gold.jpg _site/assets/images/ 2>/dev/null || true
          cp assets/images/bg.jpg _site/assets/images/ 2>/dev/null || true
          cp web/babe.html _site/index.html 2>/dev/null || true
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages