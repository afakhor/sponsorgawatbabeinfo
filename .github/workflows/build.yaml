name: BABE.INFO AUTO ERROR FILTER

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.29.0', channel: stable }

      - name: Install CMake
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" "ndk;25.1.8937393"

      - name: Patch CMake
        run: |
          PUB=$HOME/.pub-cache/hosted/pub.dev
          ANGLE=$(find $PUB -maxdepth 1 -type d -name "flutter_angle-*" | head -n1)
          find $ANGLE -name "CMakeLists.txt" -exec sed -i 's/3\.31/3.22.1/g' {} + 2>/dev/null || true

      - name: Build APK
        run: |
          flutter clean
          rm -f pubspec.lock
          flutter pub get
          flutter build apk --release 2>&1 | tee build.log
          
          echo "========== FILTER ERROR PENTING ==========" 
          cat build.log | grep -i "error:" | head -n 50
          echo "========== END FILTER =========="
          
          find build/ android/ -name "*.apk" -type f

      - name: Upload Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Rename APK (saran kamu)
        if: success()
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          APK_PATH=$(find build/ android/ -type f -name "*.apk" | grep -i "release" | head -n 1)
          [ -z "$APK_PATH" ] && APK_PATH=$(find build/ android/ -type f -name "*.apk" | head -n 1)
          
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Menemukan APK di: $APK_PATH"
            cp "$APK_PATH" build/app/outputs/flutter-apk/BABE-INFO-threejs-antiblink.apk
            echo "Berhasil menyalin ke BABE-INFO-threejs-antiblink.apk"
          else
            echo "APK Release tidak ditemukan di direktori manapun!"
            echo "Lihat ERROR di atas 👆"
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ github.run_number }}
          files: build/app/outputs/flutter-apk/BABE-INFO-threejs-antiblink.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}