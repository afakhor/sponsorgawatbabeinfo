name: BABE.INFO Learn three_js

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable

      - name: Get deps
        run: flutter pub get

      - name: PATCH flutter_gl + threeegl + kotlin (fix total)
        run: |
          FLUTTER_GL=$(find ~/.pub-cache/hosted/pub.dev -type d -name "flutter_gl-*" | head -n 1)
          echo "Found: $FLUTTER_GL"
          # 1. Fix kotlin 1.3.61 -> 1.9.22
          sed -i 's/1.3.61/1.9.22/g' $FLUTTER_GL/android/build.gradle
          sed -i 's/1.5.20/1.9.22/g' $FLUTTER_GL/android/build.gradle
          # 2. Add namespace kalau belum ada
          if ! grep -q "namespace" $FLUTTER_GL/android/build.gradle; then
            sed -i '/android {/a \    namespace "com.wasabeef.flutter_gl"' $FLUTTER_GL/android/build.gradle
          fi
          # 3. Fix threeegl.aar location - copy ke lokasi yang dicari Gradle
          mkdir -p $FLUTTER_GL/android/libs
          mkdir -p $FLUTTER_GL/android/app/libs/aars
          find $FLUTTER_GL -name "*.aar" -exec cp {} $FLUTTER_GL/android/libs/ \; 2>/dev/null || true
          find $FLUTTER_GL -name "threeegl*" -exec cp {} $FLUTTER_GL/android/libs/ \; 2>/dev/null || true
          # Buat folder libs di app juga biar tidak error
          mkdir -p android/app/libs/aars
          cp $FLUTTER_GL/android/libs/*.aar android/app/libs/aars/ 2>/dev/null || true
          cp $FLUTTER_GL/android/*.aar android/app/libs/aars/ 2>/dev/null || true
          ls -R $FLUTTER_GL/android/libs || true
          cat $FLUTTER_GL/android/build.gradle

      - name: Build APK Direct (bukan zip)
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/BABE-INFO-threejs-globe.apk

      - name: Release APK Langsung Download
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v3d-${{ github.run_number }}
          name: BABE.INFO 3D Globe ${{ github.run_number }}
          body: |
            Learn by doing three_js + flutter_gl - FIXED
            - Globe di atas, tidak nutupin BABE.INFO & HeruWingchun
            - Tulisan di globe lengkap BABE.INFO
            - APK langsung install (bukan zip)
          files: build/app/outputs/flutter-apk/BABE-INFO-threejs-globe.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}