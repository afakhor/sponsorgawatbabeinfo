name: BABE.INFO sponsorbabeinfogawat FIX FINAL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true

      - name: Install CMake & NDK (Wajib untuk flutter_angle)
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" "ndk;25.1.8937393" --sdk_root=$ANDROID_SDK_ROOT
          echo "CMAKE OK"
          cmake --version || $ANDROID_HOME/cmake/3.22.1/bin/cmake --version

      - name: Clean & Get
        run: |
          flutter clean
          rm -f pubspec.lock
          flutter pub get

      - name: PATCH CMake Version flutter_angle
        run: |
          PUB_DIR=$HOME/.pub-cache/hosted/pub.dev
          ANGLE=$(find $PUB_DIR -maxdepth 1 -type d -name "flutter_angle-*" | head -n 1)
          if [ -d "$ANGLE" ]; then
            echo "Patching $ANGLE"
            find $ANGLE -type f \( -name "CMakeLists.txt" -o -name "build.gradle" \) -exec sed -i 's/3\.31/3.22.1/g; s/3\.31\.4/3.22.1/g' {} +
          fi

      - name: Build APK Release
        run: flutter build apk --release -v 2>&1 | tee build.log

      - name: Upload Log (selalu upload biar kelihatan error)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Rename APK
        if: success()
        run: |
          echo "Cari APK..."
          find . -type f -name "*.apk" | head -n 20
          APK=$(find . -type f -name "*.apk" | grep -i release | head -n 1)
          echo "APK ditemukan: $APK"
          mkdir -p build/app/outputs/flutter-apk/
          cp "$APK" build/app/outputs/flutter-apk/BABE-INFO-sponsorbabeinfogawat-FIXED.apk
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-fixed
          path: build/app/outputs/flutter-apk/BABE-INFO-sponsorbabeinfogawat-FIXED.apk

      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3d-${{ github.run_number }}
          name: FIXED v${{ github.run_number }}
          body: Package com.example.sponsorbabeinfogawat - build dir fixed
          files: build/app/outputs/flutter-apk/BABE-INFO-sponsorbabeinfogawat-FIXED.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}