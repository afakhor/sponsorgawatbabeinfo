name: BABE.INFO Learn three_js

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable

      - name: Get deps
        run: flutter pub get

      - name: OVERWRITE flutter_gl FIX threeegl + JVM
        run: |
          FLUTTER_GL=$(find ~/.pub-cache/hosted/pub.dev -type d -name "flutter_gl-*" | head -n 1)
          echo "Found: $FLUTTER_GL"
          ls -R $FLUTTER_GL | grep -i aar || true
          # copy semua aar yang ada
          mkdir -p $FLUTTER_GL/android/libs
          find $FLUTTER_GL -name "*.aar" -exec cp {} $FLUTTER_GL/android/libs/ \; 2>/dev/null || true
          ls $FLUTTER_GL/android/libs/

          cat > $FLUTTER_GL/android/build.gradle <<'EOF'
          group 'com.wasabeef.flutter_gl'
          version '1.0-SNAPSHOT'
          buildscript {
              ext.kotlin_version = '1.9.22'
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          rootProject.allprojects {
              repositories { google(); mavenCentral() }
          }
          apply plugin: 'com.android.library'
          apply plugin: 'kotlin-android'
          android {
              namespace "com.wasabeef.flutter_gl"
              compileSdk 33
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions { jvmTarget = "1.8" }
              defaultConfig { minSdk 24 }
          }
          repositories {
              flatDir { dirs 'libs' }
          }
          dependencies {
              implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
              implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
          }
          EOF
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"></manifest>' > $FLUTTER_GL/android/src/main/AndroidManifest.xml
          cat $FLUTTER_GL/android/build.gradle

      - name: Build APK Direct (bukan zip)
        run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/BABE-INFO-threejs-globe.apk

      - name: Release APK Langsung Download
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v3d-${{ github.run_number }}
          name: BABE.INFO 3D Globe ${{ github.run_number }}
          body: |
            FINAL FIX JVM TARGET OVERWRITE
            - Globe di atas tidak nutupin BABE.INFO
            - APK langsung install
          files: build/app/outputs/flutter-apk/BABE-INFO-threejs-globe.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}