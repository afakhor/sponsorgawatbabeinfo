name: Build BABE.INFO Blackhole APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-blackhole-apk:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter - FIX
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          # flutter-version dihapus - auto latest!

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Clean & Get
        run: |
          flutter clean
          flutter pub get

      - name: Fix Gradle Wrapper URL (anti github 404)
        run: |
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https://services.gradle.org/distributions/gradle-8.13-all.zip
          EOF
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BABE-INFO-Blackhole-APK
          path: build/app/outputs/flutter-apk/*.apk