name: BABE.INFO Learn three_js
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable

      - run: flutter pub get

      - name: Install CMake
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" --sdk_root=$ANDROID_SDK_ROOT

      - name: PATCH flutter_angle if exists
        run: |
          PUB_DIR=${PUB_CACHE:-/home/runner/.pub-cache}/hosted/pub.dev
          ANGLE=$(find $PUB_DIR -maxdepth 1 -type d -name "flutter_angle-*" | head -n 1)
          echo "ANGLE: $ANGLE"
          if [ -n "$ANGLE" ] && [ -d "$ANGLE" ]; then
            sed -i 's/3.31.4/3.22.1/g' $ANGLE/android/build.gradle || true
            sed -i 's/3\.31/3.22.1/g' $ANGLE/android/build.gradle || true
            if [ -f "$ANGLE/android/src/main/cpp/CMakeLists.txt" ]; then
              sed -i 's/3.31.4/3.22.1/g' $ANGLE/android/src/main/cpp/CMakeLists.txt || true
              sed -i 's/3\.31/3.22.1/g' $ANGLE/android/src/main/cpp/CMakeLists.txt || true
            fi
          else
            echo "flutter_angle not found, skip"
          fi

      - run: flutter build apk --release

      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/BABE-INFO-threejs-globe.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3d-${{ github.run_number }}
          name: BABE.INFO 3D Globe ${{ github.run_number }}
          body: APK + Web 3D siap share WhatsApp - texture babe_gold.jpg anti blink
          files: build/app/outputs/flutter-apk/BABE-INFO-threejs-globe.apk
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy-web:
    runs-on: ubuntu-latest
    needs: build-apk
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build web simple
        run: |
          mkdir -p _site/assets/images
          cp web/babe.html _site/
          cp assets/images/babe_gold.jpg _site/assets/images/ 2>/dev/null || true
          cp assets/images/bg.jpg _site/assets/images/ 2>/dev/null || true
          cp web/babe.html _site/index.html
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages