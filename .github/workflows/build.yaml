name: BABE.INFO Learn three_js anti blink

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter 3.29.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true

      - name: Flutter Clean & Pub Get
        run: |
          rm -f pubspec.lock
          flutter clean
          flutter pub get

      - name: Check Package Name Sync
        run: |
          echo "=== Cek package ==="
          cat pubspec.yaml | grep name:
          cat android/app/build.gradle.kts | grep -E "namespace|applicationId"
          ls android/app/src/main/kotlin/com/example/sponsorgawatbabeinfo/ || echo "FOLDER SALAH!"

      - name: Build APK Release Verbose
        run: |
          flutter build apk --release -v | tee build.log
          echo "=== APK RESULT ==="
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload Full Log (biar bisa di debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-full
          path: build.log

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK
        if: success()
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/BABE-INFO-sponsorgawatbabeinfo-antiblink.apk
          ls -lh build/app/outputs/flutter-apk/

      - name: Release APK to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3d-${{ github.run_number }}
          name: BABE.INFO Sponsor Gawat v${{ github.run_number }}
          body: |
            ### BABE.INFO 3D Globe Fixed v${{ github.run_number }}
            - Package: com.example.sponsorgawatbabeinfo (sinkron anti blink)
            - Globe 3D + 3 cincin hitam
            - Waveform + RangeSlider 60 detik (fitur full)
            - BG custom + FFmpeg MP4
            - Share ke WA Status
            - Fix: loading terus & gagal buat video (stop player + temp dir)
          files: build/app/outputs/flutter-apk/BABE-INFO-sponsorgawatbabeinfo-antiblink.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-web:
    runs-on: ubuntu-latest
    needs: build-apk
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Web Static Site
        run: |
          mkdir -p _site/assets/images
          if [ -f web/babe.html ]; then
            cp web/babe.html _site/babe.html
            cp web/babe.html _site/index.html
          fi
          if [ -d assets/images ]; then
            cp -r assets/images/* _site/assets/images/ 2>/dev/null || true
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages