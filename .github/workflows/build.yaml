name: BABE.INFO FINAL 100% JADI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.29.0', channel: stable }

      - name: Install CMake
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" "ndk;25.1.8937393"

      - name: Patch CMake
        run: |
          PUB=$HOME/.pub-cache/hosted/pub.dev
          mkdir -p $PUB
          # patch nanti setelah pub get

      - name: Build
        run: |
          flutter clean
          flutter pub get
          # Patch SETELAH pub get
          PUB=$HOME/.pub-cache/hosted/pub.dev
          ANGLE=$(find $PUB -maxdepth 1 -type d -name "flutter_angle-*" | head -n1)
          find $ANGLE -type f \( -name "*.txt" -o -name "*.gradle" \) -exec sed -i 's/3\.31\.4/3.22.1/g; s/3\.31/3.22.1/g' {} + 2>/dev/null || true
          
          flutter build apk --release 2>&1 | tee build.log
          find build/ -name "*.apk"

      - name: Rename APK - FINAL NO TYPO
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          APK=$(find build/ -name "*.apk" | grep release | head -n1)
          echo "APK=$APK"
          ls -lh $APK
          cp "$APK" build/app/outputs/flutter-apk/BABE-INFO-threejs-antiblink.apk
          cp "$APK" ./BABE-INFO-threejs-antiblink.apk
          ls -lh ./*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: BABE-INFO-threejs-antiblink.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}