name: BABE.INFO Learn three_js
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
      - run: flutter pub get
      - run: flutter pub deps | grep three_js
      - run: ls ~/.pub-cache/hosted/pub.dev | grep three
      - name: Install CMake
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" --sdk_root=$ANDROID_SDK_ROOT

      - name: PATCH flutter_gl + flutter_angle FIX AAR
        run: |
          PUB_DIR=${PUB_CACHE:-/home/runner/.pub-cache}/hosted/pub.dev
          if [ ! -d "$PUB_DIR" ]; then PUB_DIR=~/.pub-cache/hosted/pub.dev; fi
          echo "PUB_DIR: $PUB_DIR"
          ls $PUB_DIR | grep flutter_gl || true
          
          FLUTTER_GL=$(find $PUB_DIR -maxdepth 1 -type d -name "flutter_gl-*" | head -n 1)
          echo "FLUTTER_GL: $FLUTTER_GL"
          
          if [ -n "$FLUTTER_GL" ] && [ -d "$FLUTTER_GL" ]; then
            AAR_FILE=$(find $FLUTTER_GL -name "*.aar" | head -n 1)
            echo "Found AAR: $AAR_FILE"
            mkdir -p /tmp/aar_extract $FLUTTER_GL/android/libs
            if [ -n "$AAR_FILE" ] && [ -f "$AAR_FILE" ]; then
              unzip -o "$AAR_FILE" -d /tmp/aar_extract
              cp /tmp/aar_extract/classes.jar $FLUTTER_GL/android/libs/ || true
              mkdir -p $FLUTTER_GL/android/src/main/jniLibs
              cp -r /tmp/aar_extract/jni/* $FLUTTER_GL/android/src/main/jniLibs/ 2>/dev/null || true
            fi
            cat > $FLUTTER_GL/android/build.gradle <<'EOF'
          group 'com.wasabeef.flutter_gl'
          version '1.0-SNAPSHOT'
          buildscript {
              ext.kotlin_version = '1.9.22'
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          rootProject.allprojects { repositories { google(); mavenCentral() } }
          apply plugin: 'com.android.library'
          apply plugin: 'kotlin-android'
          android {
              namespace "com.wasabeef.flutter_gl"
              compileSdk 33
              compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
              kotlinOptions { jvmTarget = "1.8" }
              defaultConfig { minSdk 24 }
              lint { checkReleaseBuilds false; abortOnError false }
          }
          dependencies {
              implementation fileTree(dir: 'libs', include: ['*.jar'])
              implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
          }
          EOF
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"></manifest>' > $FLUTTER_GL/android/src/main/AndroidManifest.xml
          else
            echo "flutter_gl not found, skip patch"
          fi
          
          ANGLE=$(find $PUB_DIR -maxdepth 1 -type d -name "flutter_angle-*" | head -n 1)
          echo "ANGLE: $ANGLE"
          if [ -n "$ANGLE" ] && [ -d "$ANGLE" ]; then
            sed -i 's/3.31.4/3.22.1/g' $ANGLE/android/build.gradle || true
            sed -i 's/3\.31/3.22.1/g' $ANGLE/android/build.gradle || true
            sed -i 's/3.31.4/3.22.1/g' $ANGLE/android/src/main/cpp/CMakeLists.txt || true
            sed -i 's/3\.31/3.22.1/g' $ANGLE/android/src/main/cpp/CMakeLists.txt || true
          fi

      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/BABE-INFO-threejs-globe.apk
      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3d-${{ github.run_number }}
          name: BABE.INFO 3D Globe ${{ github.run_number }}
          body: APK + Web 3D siap share WhatsApp - texture babe_gold.jpg
          files: build/app/outputs/flutter-apk/BABE-INFO-threejs-globe.apk
          token: ${{ secrets.GITHUB_TOKEN }}

  deploy-web:
    runs-on: ubuntu-latest
    needs: build-apk
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build web simple
        run: |
          mkdir -p _site/assets/images
          cp web/babe.html _site/
          cp assets/images/babe_gold.jpg _site/assets/images/
          cp assets/images/bg.jpg _site/assets/images/ 2>/dev/null || true
          cp web/babe.html _site/index.html
          echo "<!-- BABE.INFO Globe 3D -->" > _site/README.md
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages