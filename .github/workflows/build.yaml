name: VERBOSE FULL
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable

      - name: VERBOSE BUILD
        run: |
          set -x
          rm -f pubspec.lock
          flutter clean
          flutter pub get
          flutter build apk --release -v 2>&1 | tee build.log
          echo "=== TAIL ERROR ==="
          tail -n 300 build.log
          ls -lh build/ || true
          ls -lh build/app/outputs/flutter-apk/ || true

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-full
          path: build.log