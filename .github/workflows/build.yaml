name: BABE.INFO Learn three_js anti blink

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
          cache: true

      - name: Clean Old Lock
        run: rm -f pubspec.lock

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Install CMake 3.22.1
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" --sdk_root=$ANDROID_SDK_ROOT

      - name: Configure Gradle Properties & Memory
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" > ~/.gradle/gradle.properties
          
          # Mencegah peringatan AGP & compileSdk 35
          echo "android.suppressUnsupportedCompileSdk=35" >> android/gradle.properties

      - name: PATCH Plugins & App (Manifest, CMake, Kotlin, JVM Target & CompileSDK Fix)
        run: |
          PUB_DIR=/home/runner/.pub-cache/hosted/pub.dev
          
          # 1. Hapus atribut package="..." di seluruh AndroidManifest.xml plugin (Fix AGP 8+)
          echo "Clearing usang package attributes from all plugin manifests..."
          find $PUB_DIR -type f -name "AndroidManifest.xml" -exec sed -i -E 's/package="[^"]*"//g' {} +

          # 2. FIX lStar Error: Force compileSdkVersion / compileSdk ke 34 di seluruh plugin
          echo "Forcing compileSdkVersion to 34 for all plugins..."
          find $PUB_DIR -type f -name "build.gradle" -exec sed -i -E 's/compileSdkVersion [0-9]+/compileSdkVersion 34/g' {} +
          find $PUB_DIR -type f -name "build.gradle" -exec sed -i -E 's/compileSdk [0-9]+/compileSdk 34/g' {} +

          # 3. Enforce JVM Target 17 secara konsisten di seluruh Gradle & App
          echo "Enforcing Java 17 target across all gradle files..."
          find $PUB_DIR android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' {} +
          find $PUB_DIR android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g" {} +
          find $PUB_DIR android -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' {} +

          # 4. Patch CMake versi flutter_angle
          ANGLE=$(find $PUB_DIR -maxdepth 1 -type d -name "flutter_angle-*" | head -n 1)
          if [ -n "$ANGLE" ] && [ -d "$ANGLE" ]; then
            find $ANGLE -type f \( -name "build.gradle" -o -name "CMakeLists.txt" \) -exec sed -i 's/3.31.4/3.22.1/g' {} +
            find $ANGLE -type f \( -name "build.gradle" -o -name "CMakeLists.txt" \) -exec sed -i 's/3\.31/3.22.1/g' {} +
          fi

          # 5. Patch CMake & Kotlin version (1.3.61 -> 1.9.22) milik flutter_gl
          GL=$(find $PUB_DIR -maxdepth 1 -type d -name "flutter_gl-*" | head -n 1)
          if [ -n "$GL" ] && [ -d "$GL" ]; then
            echo "Patching flutter_gl in $GL"
            find $GL -type f -name "build.gradle" -exec sed -i 's/1.3.61/1.9.22/g' {} +
            find $GL -type f \( -name "build.gradle" -o -name "CMakeLists.txt" \) -exec sed -i 's/3.31.4/3.22.1/g' {} +
          fi


      - name: Copy Flutter GL AAR Dependencies
        run: |
          mkdir -p android/app/libs
          mkdir -p android/app/libs/aars
          
          echo "Mencari dan menyalin seluruh file AAR milik flutter_gl..."
          find $HOME/.pub-cache /opt/hostedtoolcache -name "*.aar" -exec cp {} android/app/libs/ \; 2>/dev/null || true
          find $HOME/.pub-cache /opt/hostedtoolcache -name "*.aar" -exec cp {} android/app/libs/aars/ \; 2>/dev/null || true
          
          echo "File AAR yang tersedia di libs:"
          ls -la android/app/libs/

      - name: Ensure Gradle Wrapper Exists & Executable
        run: |
          if [ ! -f android/gradlew ]; then
            echo "gradlew tidak ditemukan, generate via flutter..."
            flutter build apk --config-only
          fi
          chmod +x android/gradlew

      - name: Build APK Release Direct via Gradle
        run: |
          cd android
          ./gradlew assembleRelease --warning-mode none

      - name: Rename APK
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          
          # Cari file APK release hasil build secara dinamis
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          
          if [ -f "$APK_PATH" ]; then
            echo "Menemukan APK di: $APK_PATH"
            cp "$APK_PATH" build/app/outputs/flutter-apk/BABE-INFO-threejs-antiblink.apk
          else
            echo "APK tidak ditemukan di folder android, mencari di folder build root..."
            find build/ -name "*.apk"
            exit 1
          fi

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3d-${{ github.run_number }}
          name: BABE.INFO 3D Globe AntiBlink v${{ github.run_number }}
          body: |
            ### BABE.INFO 3D Globe Anti-Blink Build #${{ github.run_number }}
            - Fixed GPU FlutterGL Flickering Issue via Ticker & RepaintBoundary
            - Full Texture Support (`babe_gold.jpg`)
            - Hybrid Web3D + FFmpeg Video Generator
          files: build/app/outputs/flutter-apk/BABE-INFO-threejs-antiblink.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-web:
    runs-on: ubuntu-latest
    needs: build-apk
    permissions:
      contents: write
      pages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Web Static Site
        run: |
          mkdir -p _site/assets/images
          if [ -f web/babe.html ]; then
            cp web/babe.html _site/babe.html
            cp web/babe.html _site/index.html
          fi
          if [ -d assets/images ]; then
            cp -r assets/images/* _site/assets/images/ 2>/dev/null || true
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
