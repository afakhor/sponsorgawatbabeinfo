name: BABE.INFO Learn three_js + flutter_gl

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable

      - name: Get deps
        run: flutter pub get

      - name: PATCH flutter_gl jadul -> Kotlin 1.9.22 + namespace
        run: |
          FLUTTER_GL_DIR=$(find ~/.pub-cache -type d -name "flutter_gl-*" | head -n 1)
          echo "Patching $FLUTTER_GL_DIR"
          # patch kotlin version
          sed -i 's/1.3.61/1.9.22/g' $FLUTTER_GL_DIR/android/build.gradle
          # tambah namespace kalau belum ada
          if ! grep -q "namespace" $FLUTTER_GL_DIR/android/build.gradle; then
            sed -i '/android {/a \    namespace "com.wasabeef.flutter_gl"' $FLUTTER_GL_DIR/android/build.gradle
          fi
          cat $FLUTTER_GL_DIR/android/build.gradle

      - name: Build APK Direct (bukan zip)
        run: flutter build apk --release

      - name: Rename biar langsung install
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/BABE-INFO-threejs-globe.apk

      - name: Release APK Langsung Download
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v3d-${{ github.run_number }}
          name: BABE.INFO 3D Globe Learn - ${{ github.run_number }}
          body: |
            Learn by doing three_js + flutter_gl
            - Fix namespace flutter_gl
            - Fix Kotlin 1.3.61 -> 1.9.22
            - Globe fix tidak nutupin BABE.INFO, tulisan di globe lengkap BABE.INFO
          files: build/app/outputs/flutter-apk/BABE-INFO-threejs-globe.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}