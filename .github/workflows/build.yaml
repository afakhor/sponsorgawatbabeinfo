name: BABE.INFO Learn three_js
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
      - run: flutter pub get
      - name: Install CMake
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" --sdk_root=$ANDROID_SDK_ROOT
      - name: PATCH flutter_gl + flutter_angle
        run: |
          FLUTTER_GL=$(find ~/.pub-cache/hosted/pub.dev -type d -name "flutter_gl-*" | head -n 1)
          mkdir -p $FLUTTER_GL/android/libs
          find $FLUTTER_GL -name "*.aar" -exec cp {} $FLUTTER_GL/android/libs/ \; 2>/dev/null || true
          cat > $FLUTTER_GL/android/build.gradle <<'EOF'
          group 'com.wasabeef.flutter_gl'
          version '1.0-SNAPSHOT'
          buildscript {
              ext.kotlin_version = '1.9.22'
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          rootProject.allprojects { repositories { google(); mavenCentral() } }
          apply plugin: 'com.android.library'
          apply plugin: 'kotlin-android'
          android {
              namespace "com.wasabeef.flutter_gl"
              compileSdk 33
              compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
              kotlinOptions { jvmTarget = "1.8" }
              defaultConfig { minSdk 24 }
          }
          repositories { flatDir { dirs 'libs' } }
          dependencies {
              implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
              implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
          }
          EOF
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"></manifest>' > $FLUTTER_GL/android/src/main/AndroidManifest.xml
          ANGLE=$(find ~/.pub-cache/hosted/pub.dev -type d -name "flutter_angle-*" | head -n 1)
          sed -i 's/3.31.4/3.22.1/g' $ANGLE/android/build.gradle
          sed -i 's/3\.31/3.22.1/g' $ANGLE/android/build.gradle
          sed -i 's/3.31.4/3.22.1/g' $ANGLE/android/src/main/cpp/CMakeLists.txt
          sed -i 's/3\.31/3.22.1/g' $ANGLE/android/src/main/cpp/CMakeLists.txt
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/BABE-INFO-threejs-globe.apk
      - uses: softprops/action-gh-release@v1
        with:
          tag_name: v3d-${{ github.run_number }}
          name: BABE.INFO 3D Globe ${{ github.run_number }}
          body: APK + Web 3D siap share WhatsApp
          files: build/app/outputs/flutter-apk/BABE-INFO-threejs-globe.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-web:
    runs-on: ubuntu-latest
    needs: build-apk
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build web simple (bukan flutter web biar ringan)
        run: |
          mkdir -p _site/assets/images
          cp web/babe.html _site/
          cp assets/images/babe_gold.jpg _site/assets/images/
          cp assets/images/bg.jpg _site/assets/images/ 2>/dev/null || true
          cp web/babe.html _site/index.html
          echo "<!-- BABE.INFO Globe 3D -->" > _site/README.md
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages