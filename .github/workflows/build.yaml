name: BABE.INFO CMAKE 3.31.4 FIX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.29.0', channel: stable }

      - name: Install CMake 3.31.4 & 3.22.1
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" "cmake;3.31.4" "ndk;25.1.8937393" || \
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" "ndk;25.1.8937393"
          ls $ANDROID_HOME/cmake/

      - name: Clean & Get
        run: |
          flutter clean
          rm -f pubspec.lock
          flutter pub get

      - name: PATCH flutter_angle CMake 3.31.4 -> 3.22.1 (SETELAH pub get!)
        run: |
          PUB=$HOME/.pub-cache/hosted/pub.dev
          ANGLE=$(find $PUB -maxdepth 1 -type d -name "flutter_angle-*" | head -n1)
          echo "PATCHING $ANGLE"
          if [ -d "$ANGLE" ]; then
            # Ganti semua 3.31.4 jadi 3.22.1
            find $ANGLE -type f -name "*.txt" -o -name "*.gradle" | xargs sed -i 's/3\.31\.4/3.22.1/g; s/3\.31/3.22.1/g' 2>/dev/null || true
            grep -r "cmake" $ANGLE --include="*.gradle" --include="*.txt" | head -20
          fi

      - name: Build APK
        run: |
          flutter build apk --release -v 2>&1 | tee build.log
          echo "=== FILTER ERROR ==="
          cat build.log | grep -E "Error:|FAILURE|CXX1300|CMake" | head -20
          find build/ android/ -name "*.apk" -type f

      - name: Upload Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Rename APK
        if: success()
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          APK_PATH=$(find build/ android/ -type f -name "*.apk" | grep -i "release" | head -n 1)
          [ -z "$APK_PATH" ] && APK_PATH=$(find build/ android/ -type f -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            echo "Menemukan APK di: $APK_PATH"
            cp "$APK_PATH" build/app/outputs/flutter-apk/BABE-INFO-threejs-antiblink.apk
            cp "$APK_PATH"./BABE-INFO-threejs-antiblink.apk
          else
            echo "APK tidak ketemu!"
            tail -n 100 build.log
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ github.run_number }}
          files: build/app/outputs/flutter-apk/BABE-INFO-threejs-antiblink.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}