# 1. Fix gradle 8.14
echo "distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.0-all.zip" > android/gradle/wrapper/gradle-wrapper.properties

# 2. Fix settings.gradle.kts
cat > android/settings.gradle.kts << 'EOF'
pluginManagement {
    val flutterSdkPath = run {
        val properties = java.util.Properties()
        file("local.properties").takeIf { it.exists() }?.inputStream()?.use { properties.load(it) }
        val flutterSdkFromEnv = System.getenv("FLUTTER_ROOT")
        val flutterSdkFromProp = properties.getProperty("flutter.sdk")
        require(flutterSdkFromEnv != null || flutterSdkFromProp != null) { "flutter.sdk must be defined" }
        flutterSdkFromEnv ?: flutterSdkFromProp
    }
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
plugins {
    id("dev.flutter.flutter-plugin-loader") version "1.0.0"
    id("com.android.application") version "8.9.1" apply false
    id("org.jetbrains.kotlin.android") version "2.1.0" apply false
}
include(":app")
EOF